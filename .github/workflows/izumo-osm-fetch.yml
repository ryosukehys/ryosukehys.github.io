# 作業用の一時ブランチ: App Store（iTunes Search API）から開発者のアプリ一覧とアイコンを取得して、このブランチに保存する
name: Fetch App Store data

on:
  push:
    branches: [claude/izumo-ekiden-osm-data]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 appstore/fetch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appstore
          git commit -m "App Store のアプリ一覧とアイコンを取得"
          git push
