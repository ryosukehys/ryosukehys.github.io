name: mapCarAlart web tests

on:
  pull_request:
    paths:
      - 'mapCarAlart/web/**'
      - '.github/workflows/mapcaralart-web-test.yml'
  push:
    branches: [main]
    paths:
      - 'mapCarAlart/web/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mapCarAlart/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # 公開する config.js にキーが書かれていないこと
      - run: grep -q "googleMapsApiKey: ''" config.js
